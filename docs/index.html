<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Convite · janjahaters</title>
  <link rel="icon" href="icon.png">
  <style>
    :root { color-scheme: dark; --accent: #ff7a1a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at top, #241d17, #141619 60%); color: #e4e6ea; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
    .card { width: min(420px, 100%); background: #1c1f23; border: 1px solid #2a2e34; border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    img { width: 84px; height: 84px; border-radius: 20px; object-fit: cover; }
    h1 { font-size: 22px; margin: 16px 0 6px; }
    p { color: #8b929c; margin: 0 0 18px; }
    a.btn { display: block; padding: 12px; border-radius: 8px; font-weight: 700; text-decoration: none; margin-top: 10px; }
    .primary { background: var(--accent); color: #1a0d02; }
    .ghost { background: #2c3137; color: #e4e6ea; }
    small { display: block; margin-top: 18px; color: #5d636c; }
    .bad { color: #f05454; }
  </style>
</head>
<body>
  <main class="card">
    <img src="icon.png" alt="">
    <h1 id="title">Você foi convidado para o janjahaters</h1>
    <p id="sub">Abrindo o app…</p>
    <a class="btn primary" id="open" href="#">Abrir no janjahaters</a>
    <a class="btn ghost" href="https://github.com/Romeu-q/janjahaters-app/releases/latest">Ainda não tenho o app (baixar)</a>
    <small>Depois de instalar, volte aqui e clique em "Abrir no janjahaters".</small>
  </main>
  <script>
    // o código vem depois do # e não é enviado a nenhum servidor
    const code = decodeURIComponent(location.hash.slice(1)).replace(/[^A-Za-z0-9-]/g, '');
    if (code.replace(/-/g, '').length < 16) {
      document.getElementById('title').textContent = 'Convite inválido';
      document.getElementById('sub').innerHTML = '<span class="bad">Peça o link de novo para quem te convidou.</span>';
      document.getElementById('open').remove();
    } else {
      const url = 'janjahaters://join/' + code;
      document.getElementById('open').href = url;
      location.href = url;
      setTimeout(() => (document.getElementById('sub').textContent = 'Se o app não abriu, clique no botão abaixo.'), 1500);
    }
  </script>
</body>
</html>
