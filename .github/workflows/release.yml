# Publica uma versão nova quando chega uma tag "v*" (o `npm run release` cria e envia a tag).
# O app instalado nos PCs dos amigos vê a Release nova e se atualiza sozinho.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      # login com Google: o cliente OAuth fica nos secrets GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET do repositório
      - name: Configurar login com Google
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/write-oauth.mjs
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
