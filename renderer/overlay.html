<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>janjahaters: sobreposição</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font: 600 13px "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
    #box { display: flex; flex-direction: column; gap: 4px; padding: 6px; }
    .bottom #box { justify-content: flex-end; height: calc(100vh - 12px); }
    .right .row { flex-direction: row-reverse; margin-left: auto; }
    .ch { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px #000; padding: 0 4px; }
    .right .ch { text-align: right; }
    .row { display: flex; align-items: center; gap: 7px; width: fit-content; max-width: 100%; padding: 3px 9px 3px 3px; border-radius: 16px; background: rgba(12, 13, 16, .62); transition: background .12s; }
    .right .row { padding: 3px 3px 3px 9px; }
    .av { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; box-shadow: 0 0 0 2px transparent; transition: box-shadow .12s; }
    .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; color: rgba(255,255,255,.8); }
    .row.talk { background: rgba(12, 13, 16, .82); }
    .row.talk .av { box-shadow: 0 0 0 2px #3ddc84; }
    .row.talk .name { color: #fff; }
    .row svg { flex: none; width: 14px; height: 14px; color: #f0474b; }
  </style>
</head>
<body>
  <div id="box"></div>
  <script src="overlay.js"></script>
</body>
</html>
